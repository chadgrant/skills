<polyline points="260,1137 298,1137" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="600,1137 638,1137" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="755,1169 755,1195 150,1195 150,1218" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="452" y="1188" text-anchor="middle" class="lbl" style="fill:#2563eb">then re-verify, no second review</text>
<polyline points="240,1252 264,1252" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="446,1252 470,1252" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="652,1252 676,1252" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="766,1284 766,1308" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="856,1330 940,1330 940,370 467,370" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m-purple)"/>
<text x="910" y="1322" text-anchor="middle" class="lbl" style="fill:#7c3aed">next</text>
<text x="700" y="364" text-anchor="middle" class="lbl" style="fill:#7c3aed">next milestone starts with its contracts</text>
