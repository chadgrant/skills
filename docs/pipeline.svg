<marker id="m-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/></marker>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:13.5px;font-weight:600}.s{font-size:11.5px;fill:#475569}.h{font-size:14px;font-weight:700}.lbl{font-size:11.5px;font-weight:600}</style>
</defs>
<rect width="980" height="1500" fill="#ffffff"/>
<text x="40" y="40" style="font-size:20px;font-weight:700">How a build runs: contracts first, parallel waves, one review per feature</text>
<text x="40" y="60" class="s">chadgrant:planning → chadgrant:implementation → chadgrant:code-review</text>
<rect x="30" y="78" width="870" height="122" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="6,4"/>
<text x="50" y="102" class="h" style="fill:#7c3aed">1 · Plan  (chadgrant:planning)</text>
<rect x="30" y="240" width="870" height="110" rx="12" fill="#f8fafc" stroke="#475569" stroke-dasharray="6,4"/>
<text x="50" y="264" class="h" style="fill:#475569">2 · Start the run  (orchestrator)</text>
<rect x="30" y="390" width="870" height="130" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-dasharray="6,4"/>
<text x="50" y="414" class="h" style="fill:#0d9488">3 · Contracts first  (every milestone)</text>
<rect x="30" y="560" width="870" height="460" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6,4"/>
<text x="50" y="584" class="h" style="fill:#2563eb">4 · The wave loop  (usually one wave per milestone)</text>
<rect x="30" y="1060" width="870" height="310" rx="12" fill="#f0fdf4" stroke="#059669" stroke-dasharray="6,4"/>
<text x="50" y="1084" class="h" style="fill:#059669">5 · Milestone gate</text>
<polyline points="300,148 343,148" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="585,148 628,148" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="465,200 465,238" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="360,305 398,305" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="660,305 698,305" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#m-gray)"/>
<text x="679" y="297" text-anchor="middle" class="lbl" style="fill:#6b7280">stale</text>
<polyline points="465,350 465,388" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="250,460 268,460" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#m-teal)"/>
<polyline points="470,460 488,460" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#m-teal)"/>
<polyline points="690,460 708,460" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#m-teal)"/>
<polyline points="795,492 795,535 465,535 465,598" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="630" y="551" text-anchor="middle" class="lbl" style="fill:#0d9488">contracts merged: nothing waits on anything</text>
<polyline points="465,656 465,678" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="175,678 755,678" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="175,678 175,698" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="465,678 465,698" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="755,678 755,698" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="612" y="670" text-anchor="middle" class="lbl" style="fill:#2563eb">dispatch the whole wave in one message</text>
<polyline points="175,780 175,800" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="465,780 465,800" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="755,780 755,800" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="175,800 755,800" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="465,800 465,818" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="612" y="792" text-anchor="middle" class="lbl" style="fill:#2563eb">commit + merge each branch</text>
<polyline points="345,870 48,870 48,740 63,740" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
<text x="196" y="862" text-anchor="middle" class="lbl" style="fill:#ea580c">red: send back, or escalate a tier</text>
<polyline points="465,920 465,948" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="478" y="938" text-anchor="start" class="lbl" style="fill:#059669">green</text>
<polyline points="615,973 880,973 880,640 617,640" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m-purple)"/>
<text x="748" y="965" text-anchor="middle" class="lbl" style="fill:#7c3aed">next wave</text>
<polyline points="465,996 465,1042 230,1042 230,1103" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
