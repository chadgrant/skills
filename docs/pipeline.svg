<text x="465.0" y="745.0" text-anchor="middle" class="s">own worktree · no chat</text>
<text x="465.0" y="762.0" text-anchor="middle" class="s">contract tests → green</text>
<rect x="645" y="700" width="220" height="80" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="755.0" y="729.0" text-anchor="middle" class="t">Worker · implements CONs</text>
<text x="755.0" y="745.0" text-anchor="middle" class="s">own worktree · no chat</text>
<text x="755.0" y="762.0" text-anchor="middle" class="s">contract tests → green</text>
<polygon points="465,820 585,870 465,920 345,870" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="465" y="867" text-anchor="middle" class="t">Fast gate green?</text>
<text x="465" y="884" text-anchor="middle" class="s">unit + contract tests · lint</text>
<rect x="315" y="950" width="300" height="46" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="978.0" text-anchor="middle" class="t">Wave verified · drop worktrees</text>
<rect x="60" y="1105" width="200" height="64" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
<text x="160.0" y="1134.0" text-anchor="middle" class="t">Full gate</text>
<text x="160.0" y="1150.0" text-anchor="middle" class="s">Docker · integration · e2e</text>
<rect x="300" y="1105" width="300" height="64" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
<text x="450.0" y="1126.0" text-anchor="middle" class="t">/simplify + feature review</text>
<text x="450.0" y="1142.0" text-anchor="middle" class="s">8 lenses, reuse + patterns</text>
<text x="450.0" y="1159.0" text-anchor="middle" class="s">+ security reviewer for spine tasks</text>
