<text x="795.0" y="457.0" text-anchor="middle" class="t">Commit, freeze</text>
<text x="795.0" y="473.0" text-anchor="middle" class="s">workers never edit them</text>
<rect x="315" y="600" width="300" height="56" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="625.0" text-anchor="middle" class="t">Pick the wave</text>
<text x="465.0" y="641.0" text-anchor="middle" class="s">every task, built against the stubs</text>
<rect x="65" y="700" width="220" height="80" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="175.0" y="729.0" text-anchor="middle" class="t">Worker · implements CONs</text>
<text x="175.0" y="745.0" text-anchor="middle" class="s">own worktree · no chat</text>
<text x="175.0" y="762.0" text-anchor="middle" class="s">contract tests → green</text>
<rect x="355" y="700" width="220" height="80" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
