<text x="180.0" y="145.0" text-anchor="middle" class="t">Clarify in rounds</text>
<text x="180.0" y="161.0" text-anchor="middle" class="s">a recommended answer to each</text>
<rect x="345" y="118" width="240" height="60" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="145.0" text-anchor="middle" class="t">Requirements + GLOSSARY</text>
<text x="465.0" y="161.0" text-anchor="middle" class="s">PRD · ERD · DRD, every item has an ID</text>
<rect x="630" y="118" width="240" height="60" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="750.0" y="137.0" text-anchor="middle" class="t">Plan</text>
<text x="750.0" y="153.0" text-anchor="middle" class="s">contracts (CON) per milestone</text>
<text x="750.0" y="170.0" text-anchor="middle" class="s">tasks that implement them</text>
<rect x="60" y="280" width="300" height="50" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/>
<text x="210.0" y="310.0" text-anchor="middle" class="t">Ask once: may Fable be used?</text>
<rect x="400" y="280" width="260" height="50" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/>
<text x="530.0" y="310.0" text-anchor="middle" class="t">Check the full-review stamp</text>
<rect x="700" y="276" width="180" height="58" rx="9" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sh)"/>
<text x="790.0" y="302.0" text-anchor="middle" class="t">Tell you a full</text>
<text x="790.0" y="318.0" text-anchor="middle" class="s">review is due, carry on</text>
<rect x="60" y="428" width="190" height="64" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/>
<text x="155.0" y="449.0" text-anchor="middle" class="t">One agent writes them</text>
<text x="155.0" y="465.0" text-anchor="middle" class="s">interfaces · abstract classes</text>
<text x="155.0" y="482.0" text-anchor="middle" class="s">shared types</text>
<rect x="270" y="428" width="200" height="64" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/>
<text x="370.0" y="449.0" text-anchor="middle" class="t">Doc comment = spec</text>
<text x="370.0" y="465.0" text-anchor="middle" class="s">stubs at final paths</text>
<text x="370.0" y="482.0" text-anchor="middle" class="s">contract tests, red</text>
<rect x="490" y="428" width="200" height="64" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/>
