<text x="398" y="1434" class="s">failed gate</text>
<line x1="500" y1="1430" x2="540" y2="1430" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m-purple)"/>
<text x="548" y="1434" class="s">loop</text>
<line x1="650" y1="1430" x2="690" y2="1430" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#m-gray)"/>
<text x="698" y="1434" class="s">reminder only</text>
<text x="50" y="1462" class="s">Workers coordinate only through contracts, stubs, and contract tests. No Docker and no review inside a wave; whole-codebase review only on request.</text>
