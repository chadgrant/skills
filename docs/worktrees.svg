<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1220" width="980" height="1220">
<defs>
<marker id="m-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="m-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="m-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
<marker id="m-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:13.5px;font-weight:600}.s{font-size:11.5px;fill:#475569}.h{font-size:14px;font-weight:700}.lbl{font-size:11.5px;font-weight:600}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}</style>
</defs>
<rect width="980" height="1220" fill="#ffffff"/>
<text x="40" y="40" style="font-size:20px;font-weight:700">Worktrees: parallel workers, one merge, one Docker owner</text>
<text x="40" y="60" class="s">Each worker has its own copy of the repo and runs only fast tests. The orchestrator merges, and alone runs Docker.</text>
<rect x="30" y="80" width="870" height="240" rx="12" fill="#f8fafc" stroke="#475569" stroke-dasharray="6,4"/>
<text x="50" y="104" class="h" style="fill:#475569">1 · Plan</text>
<rect x="30" y="370" width="870" height="220" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6,4"/>
<text x="50" y="394" class="h" style="fill:#2563eb">2 · Build in parallel</text>
<rect x="30" y="640" width="870" height="300" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="6,4"/>
<text x="50" y="664" class="h" style="fill:#7c3aed">3 · Merge the wave</text>
<rect x="30" y="990" width="870" height="130" rx="12" fill="#f0fdf4" stroke="#059669" stroke-dasharray="6,4"/>
<text x="50" y="1014" class="h" style="fill:#059669">4 · Milestone gate</text>
<polyline points="465,320 465,345" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="240,345 765,345" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="240,345 240,408" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="475,345 475,408" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="765,345 765,408" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="480" y="339" text-anchor="start" class="lbl" style="fill:#2563eb">one worktree each</text>
<polyline points="185,578 185,618" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="475,578 475,618" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="765,578 765,618" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="185,618 765,618" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<polyline points="465,618 465,678" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="480" y="612" text-anchor="start" class="lbl" style="fill:#2563eb">green branches, one-line reports</text>
<polyline points="465,724 465,748" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<polyline points="345,800 220,800 220,846" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
<text x="282" y="792" text-anchor="middle" class="lbl" style="fill:#ea580c">conflict</text>
<polyline points="70,868 45,868 45,701 313,701" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
<text x="180" y="693" text-anchor="middle" class="lbl" style="fill:#ea580c">resolved, fast gate green</text>
<polyline points="585,800 638,800" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="612" y="792" text-anchor="middle" class="lbl" style="fill:#059669">clean</text>
<polyline points="880,800 940,800 940,286 882,286" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m-purple)"/>
<text x="912" y="792" text-anchor="middle" class="lbl" style="fill:#7c3aed">next</text>
<polyline points="760,822 760,1018" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="772" y="975" text-anchor="start" class="lbl" style="fill:#2563eb">milestone done</text>
<rect x="60" y="118" width="220" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="170.0" y="142.0" text-anchor="middle" class="t">TASK-1 · Sign-up</text>
<rect x="60" y="164" width="220" height="38" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
<text x="170.0" y="188.0" text-anchor="middle" class="t">TASK-2 · Billing</text>
<rect x="300" y="118" width="220" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
<text x="410.0" y="142.0" text-anchor="middle" class="t">TASK-3 · Reports</text>
<rect x="300" y="164" width="220" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="410.0" y="188.0" text-anchor="middle" class="t">TASK-4 · Invoice email</text>
<rect x="560" y="112" width="320" height="92" rx="8" fill="#f9fafb" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/>
<text x="720.0" y="139.0" text-anchor="middle" class="t">Hot files, prepared in M0</text>
<text x="720.0" y="155.0" text-anchor="middle" class="s">routes: one file per group</text>
<text x="720.0" y="172.0" text-anchor="middle" class="s">migrations: timestamped</text>
<text x="720.0" y="189.0" text-anchor="middle" class="s">wiring: registration by convention</text>
<rect x="60" y="218" width="460" height="36" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="290.0" y="241.0" text-anchor="middle" class="t">Billing and accounts can both change in one feature</text>
<rect x="60" y="266" width="820" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="470.0" y="291.0" text-anchor="middle" class="t">Contracts merged first: TASK-4 calls billing through its contract stub, so it doesn't wait.</text>
<rect x="60" y="410" width="250" height="168" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
<text x="185" y="436" text-anchor="middle" class="t">Worker · TASK-1</text>
<text x="185" y="458" text-anchor="middle" class="m">worktree: task-1</text>
<text x="185" y="488" text-anchor="middle" class="s">implements its contracts</text>
<text x="185" y="509" text-anchor="middle" class="s">test → code, slice by slice</text>
<text x="185" y="530" text-anchor="middle" class="s">fast gate: unit tests + lint</text>
<text x="185" y="551" text-anchor="middle" class="s">no Docker, no database</text>
<rect x="350" y="410" width="250" height="168" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
<text x="475" y="436" text-anchor="middle" class="t">Worker · TASK-2</text>
<text x="475" y="458" text-anchor="middle" class="m">worktree: task-2</text>
<text x="475" y="488" text-anchor="middle" class="s">implements its contracts</text>
<text x="475" y="509" text-anchor="middle" class="s">test → code, slice by slice</text>
<text x="475" y="530" text-anchor="middle" class="s">fast gate: unit tests + lint</text>
<text x="475" y="551" text-anchor="middle" class="s">no Docker, no database</text>
<rect x="640" y="410" width="250" height="168" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
<text x="765" y="436" text-anchor="middle" class="t">Worker · TASK-3</text>
<text x="765" y="458" text-anchor="middle" class="m">worktree: task-3</text>
<text x="765" y="488" text-anchor="middle" class="s">implements its contracts</text>
<text x="765" y="509" text-anchor="middle" class="s">test → code, slice by slice</text>
<text x="765" y="530" text-anchor="middle" class="s">fast gate: unit tests + lint</text>
<text x="765" y="551" text-anchor="middle" class="s">no Docker, no database</text>
<rect x="315" y="680" width="300" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="699.0" text-anchor="middle" class="t">Commit + merge each branch</text>
<text x="465.0" y="715.0" text-anchor="middle" class="s">in dependency order, into the integration branch</text>
<polygon points="465,750 585,800 465,850 345,800" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="465" y="805" text-anchor="middle" class="t">Merge conflict?</text>
<rect x="70" y="848" width="220" height="42" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/>
<text x="180.0" y="866.0" text-anchor="middle" class="t">Back to that worker</text>
<text x="180.0" y="882.0" text-anchor="middle" class="s">it resolves in its worktree</text>
<rect x="640" y="778" width="240" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
<text x="760.0" y="797.0" text-anchor="middle" class="t">Fast gate on merged tree</text>
<text x="760.0" y="813.0" text-anchor="middle" class="s">green → drop worktrees</text>
<rect x="60" y="1030" width="820" height="64" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/>
<text x="470.0" y="1051.0" text-anchor="middle" class="t">Full gate: only the orchestrator, once per milestone</text>
<text x="470.0" y="1067.0" text-anchor="middle" class="s">starts Docker Compose (if the project has it) · integration tests · 90% coverage · e2e · stops it</text>
<text x="470.0" y="1084.0" text-anchor="middle" class="s">then /simplify and one feature review</text>
<line x1="50" y1="1152" x2="90" y2="1152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
<text x="98" y="1156" class="s">flow</text>
<line x1="220" y1="1152" x2="260" y2="1152" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
<text x="268" y="1156" class="s">conflict</text>
<line x1="390" y1="1152" x2="430" y2="1152" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m-purple)"/>
<text x="438" y="1156" class="s">next wave</text>
<text x="50" y="1186" class="s">One Docker owner means no fights over containers, ports, or databases, and one stack at a time on the machine.</text>
</svg>